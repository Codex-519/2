<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
</head>

<body>

    <body>

    <div style="text-align: center;">
    <img src="https://avatars.githubusercontent.com/u/145510625?s=280&v=4" alt="CodingGita" width="200" height="200">
</div>
    <h1 align="center">Registration Form</h1>

    <form action="https://www.codinggita.com" method="get" align="center">

        <label for="first name">First Name:</label>
        <input type="text" name="first name" id="first name">
       
       <br><br>

        <label for="last name">Last Name:</label>
        <input type="text" name="last name" id="last name">
       
       <br><br>

        <label for="email">Email:</label>
        <input type="email" name="email" id="email">

       <br><br>
       
        <label for="password">Password:</label>
        <input type="password" name="password" id="password">

        <br><br>

         <label for="Gender">Gender:</label>
        <select name="Gender" id="Gender">
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select>

        <br><br>

         <label for="age">Age:</label>
        <input type="number" name="age" id="age">

        <br><br>

         <label for="preference">Email Preference:</label>
         <select name="preference" id="preference">
            <option value="acrylic painting">Acrylic Painting</option>
            <option value="oil painting">Oil Painting</option>
            <option value="water color painting">Water Color Painting</option>
        </select>

        <br><br>

        <label for="date">Date:</label>
        <input type="date" name="date" id="">

        <br><br>

        <label for="select occupation">Occupation:</label>
        <select name="occupation" id="select occupation">
            <option value="artist">Artist</option>
            <option value="teacher">Teacher</option>
            <option value="student">Student</option>
            <option value="doctor">Doctor</option>
            <option value="engineer">Engineer</option>
        </select>

        <br><br>

        <label for="bio">Bio</label>

    <textarea 
        id="bio" 
        name="bio" 
        rows="7" 
        cols="40" 
        placeholder="Share few lines about yourself..."></textarea>
        
        <br><br>

        <button type="reset">RESET</button>
        <input type="submit" value="SUBMIT">
        <input type="hidden" name="userid" value="12345">

    </form>

</body>
</html>

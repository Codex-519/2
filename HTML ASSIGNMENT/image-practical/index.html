<!DOCTYPE html>
<html>
<head>
    <title>Image Practical</title>
</head>
<body>

    <h1>Question 1</h1>

    <img src="flower.jpg" alt="Beautiful flower" width="200">

    <h1>Question 2</h1>

    <img src="images/logo.png" alt="Website logo" width="200">

    <h1>Question 3</h1>

    <img src="assets/images/banner.jpg" alt="Website banner" width="200">

    <h1>Question 5</h1>

<img src="images/nature.jpg"
     alt="Beautiful nature view"
     width="300"
     height="200">

     <h1>Question 6</h1>

<img src="images/nature.jpg"
     alt="Beautiful nature view"
     title="Click to view full size">

     <h1>Question 7</h1>

<img src="images/nature.jpg"
     alt="Nature image"
     loading="lazy">

     <h1>Question 8</h1>

<img src="images/hero.jpg"
     alt="Hero image"
     loading="eager">

     <h1>Question 9</h1>

<img src="images/nature.jpg"
     alt="Nature image"
     loading="auto">

<p>The browser decides automatically whether to load the image immediately or lazily.</p>

<h1>Question 10</h1>

<img src="images/large.jpg"
     srcset="images/small.jpg 400w,
             images/medium.jpg 800w,
             images/large.jpg 1200w"
     alt="Responsive image">

     <h1>Question 11</h1>

<img src="images/photo.jpg"
     alt="Beautiful photo"
     width="400"
     height="300"
     loading="lazy"
     title="View photo"
     srcset="images/photo-small.jpg 400w,
             images/photo-large.jpg 800w">

             <h1>Question 12</h1>

<img src="assets/logo.png"
     alt="Company logo"
     width="250"
     loading="eager">

<img src="images/products/shoe.jpg"
     alt="Product shoe"
     width="250"
     loading="lazy">

</body>
</html>

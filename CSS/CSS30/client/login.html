<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Aurelian Market</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <header class="header">
      <div class="container navbar">
        <a class="brand" href="index.html"><span class="brand-mark">A</span> <span>Aurelian</span></a>
      </div>
    </header>

    <main class="auth-shell">
      <div class="auth-box">
        <h1>Welcome back</h1>
        <form id="authForm" class="auth-form">
          <div class="input-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="you@example.com" required />
          </div>
          <div class="input-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Password" required />
          </div>
          <div class="auth-actions">
            <label><input type="checkbox" /> Remember me</label>
            <a href="#" style="color: var(--primary); font-weight: 700;">Forgot password?</a>
          </div>
          <button class="primary-btn" type="submit">Sign in</button>
        </form>
        <div class="auth-switch">New to Aurelian? <a href="register.html">Create account</a></div>
      </div>
    </main>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>

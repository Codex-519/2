<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Aurelian Market</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <header class="header">
      <div class="container navbar">
        <a class="brand" href="index.html"><span class="brand-mark">A</span> <span>Aurelian</span></a>
      </div>
    </header>

    <main class="auth-shell">
      <div class="auth-box" style="width: min(700px, 100%);">
        <h1>Contact us</h1>
        <form class="auth-form">
          <div class="input-group">
            <label>Name</label>
            <input type="text" placeholder="Your name" />
          </div>
          <div class="input-group">
            <label>Email</label>
            <input type="email" placeholder="you@example.com" />
          </div>
          <div class="input-group">
            <label>Message</label>
            <textarea rows="5" style="padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: #f9f9f7;"></textarea>
          </div>
          <button class="primary-btn" type="button">Send message</button>
        </form>
      </div>
    </main>

    <script src="js/main.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | Aurelian Market</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <header class="header">
      <div class="container navbar">
        <a class="brand" href="index.html"><span class="brand-mark">A</span> <span>Aurelian</span></a>
        <nav class="nav-links">
          <a href="orders.html">Orders</a>
          <a href="wishlist.html">Wishlist</a>
        </nav>
      </div>
    </header>

    <main class="auth-shell">
      <div class="auth-box" style="width: min(680px, 100%);">
        <h1>My profile</h1>
        <div class="auth-form">
          <div class="input-group">
            <label>Name</label>
            <input type="text" value="Aditi Sharma" />
          </div>
          <div class="input-group">
            <label>Email</label>
            <input type="email" value="aditi@example.com" />
          </div>
          <div class="input-group">
            <label>Member since</label>
            <input type="text" value="January 2025" />
          </div>
          <button class="primary-btn" type="button">Save changes</button>
        </div>
      </div>
    </main>

    <script src="js/main.js"></script>
  </body>
</html>

<head>

    <title>Document</title>
    <style>
        .main{
            border: 15px solid rgb(255, 238, 0);
            height: 500px;
            width: 500px;
            display: flex;

            justify-content: space-around;
            flex-wrap: wrap;
            align-items: center;
            background: rgb(64, 27, 174);

        }
        .cont{
            border:5px solid rgb(0, 255, 132);
            height: 150px;
            width: 150px;
            
            

        }
        .cont:nth-child(4){
            /* flex-shrink: 2; */
            order: -1;
            flex-basis: 20%;
            align-self:flex-end;
            

        }

    </style>
</head>
<body>
    <div class="main">
        <div class="cont">1</div>
        <div class="cont">2</div>
        <div class="cont">3</div>
        <div class="cont">4</div>
        <div class="cont">5</div>
        <div class="cont">6</div>
    </div>

</html>

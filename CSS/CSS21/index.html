
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Solar System</title>
    <link rel="stylesheet" href="style.css">

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>

    <header>
        <h1>3D SOLAR SYSTEM</h1>
        <p>EXPLORE THE UNIVERSE</p>
    </header>

    <div id="scene"></div>

    <div class="info">
        <span class="dot"></span>
        LIVE SOLAR SYSTEM SIMULATION
    </div>

    <div class="controls">
        <button id="pauseBtn">⏸ Pause</button>
        <button id="resetBtn">↻ Reset View</button>
    </div>

    <div class="hint">Drag to rotate • Scroll to zoom</div>

    <script type="module">
        import * as THREE from "three";
        import { OrbitControls } from "three/addons/controls/OrbitControls.js";

        const container = document.getElementById("scene");

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x02040c);

        const camera = new THREE.PerspectiveCamera(
            55,
            window.innerWidth / window.innerHeight,
            0.1,
            2000
        );

        camera.position.set(0, 75, 145);

        const renderer = new THREE.WebGLRenderer({
            antialias: true
        });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.35;

        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.minDistance = 25;
        controls.maxDistance = 350;
        controls.target.set(0, 0, 0);

        scene.add(new THREE.AmbientLight(0xffffff, 0.3));

        const sunlight = new THREE.PointLight(0xffffff, 1800, 500, 1.4);
        sunlight.position.set(0, 0, 0);
        scene.add(sunlight);

        function makeTexture(base, detail) {
            const canvas = document.createElement("canvas");
            canvas.width = 512;
            canvas.height = 256;

            const ctx = canvas.getContext("2d");
            ctx.fillStyle = base;
            ctx.fillRect(0, 0, 512, 256);

            for (let i = 0; i < 1500; i++) {
                ctx.globalAlpha = Math.random() * 0.35;
                ctx.fillStyle = detail;
                ctx.beginPath();
                ctx.ellipse(
                    Math.random() * 512,
                    Math.random() * 256,
                    Math.random() * 35 + 2,
                    Math.random() * 8 + 1,
                    Math.random() * Math.PI,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
            }

            ctx.globalAlpha = 1;

            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            return texture;
        }

        const sunMaterial = new THREE.MeshBasicMaterial({
            color: 0xffb52e
        });

        const sun = new THREE.Mesh(
            new THREE.SphereGeometry(5, 64, 64),
            sunMaterial
        );

        scene.add(sun);

        const glow = new THREE.Sprite(
            new THREE.SpriteMaterial({
                map: createGlowTexture(),
                color: 0xff8a18,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            })
        );

        glow.scale.set(25, 25, 1);
        scene.add(glow);

        function createGlowTexture() {
            const canvas = document.createElement("canvas");
            canvas.width = 128;
            canvas.height = 128;

            const ctx = canvas.getContext("2d");
            const gradient = ctx.createRadialGradient(
                64, 64, 2, 64, 64, 64
            );

            gradient.addColorStop(0, "rgba(255,230,130,0.9)");
            gradient.addColorStop(0.25, "rgba(255,140,20,0.35)");
            gradient.addColorStop(1, "rgba(255,80,0,0)");

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 128, 128);

            return new THREE.CanvasTexture(canvas);
        }

        const data = [
            ["Mercury", 0.65, 9, 0.95, "#9c9690", "#ded8d0"],
            ["Venus",   1.05, 14, 0.72, "#c18b50", "#f8d8a2"],
            ["Earth",   1.15, 20, 0.55, "#1265c0", "#4ccf95"],
            ["Mars",    0.85, 26, 0.42, "#a83c25", "#ff9b70"],
            ["Jupiter", 3.00, 36, 0.25, "#ad7854", "#f1d2a5"],
            ["Saturn",  2.50, 47, 0.19, "#c5a66e", "#f5dfac"],
            ["Uranus",  1.75, 57, 0.14, "#55bacb", "#c6ffff"],
            ["Neptune", 1.70, 67, 0.11, "#2449b7", "#80aaff"]
        ];

        const planets = [];

        function createOrbit(radius) {
            const points = [];

            for (let i = 0; i <= 256; i++) {
                const angle = (i / 256) * Math.PI * 2;

                points.push(
                    new THREE.Vector3(
                        Math.cos(angle) * radius,
                        0,
                        Math.sin(angle) * radius
                    )
                );
            }

            const geometry = new THREE.BufferGeometry()
                .setFromPoints(points);

            const material = new THREE.LineBasicMaterial({
                color: 0x64748b,
                transparent: true,
                opacity: 0.4
            });

            const orbit = new THREE.LineLoop(geometry, material);
            scene.add(orbit);
        }

        data.forEach((item, index) => {
            const [name, radius, distance, speed, color1, color2] = item;

            createOrbit(distance);

            const pivot = new THREE.Group();
            scene.add(pivot);

            const material = new THREE.MeshStandardMaterial({
                map: makeTexture(color1, color2),
                roughness: 0.85,
                metalness: 0.02
            });

            const mesh = new THREE.Mesh(
                new THREE.SphereGeometry(radius, 48, 48),
                material
            );

            mesh.position.x = distance;
            mesh.rotation.z = index === 6 ? 0.5 : 0.05;
            pivot.add(mesh);

            if (name === "Saturn") {
                const ring = new THREE.Mesh(
                    new THREE.RingGeometry(3.1, 4.7, 96),
                    new THREE.MeshStandardMaterial({
                        color: 0xcdb88c,
                        side: THREE.DoubleSide,
                        transparent: true,
                        opacity: 0.85,
                        roughness: 0.9
                    })
                );

                ring.rotation.x = Math.PI / 2.35;
                mesh.add(ring);
            }

            const labelCanvas = document.createElement("canvas");
            labelCanvas.width = 256;
            labelCanvas.height = 64;

            const ctx = labelCanvas.getContext("2d");
            ctx.fillStyle = "#ffffff";
            ctx.font = "26px Arial";
            ctx.textAlign = "center";
            ctx.fillText(name, 128, 40);

            const labelTexture = new THREE.CanvasTexture(labelCanvas);

            const label = new THREE.Sprite(
                new THREE.SpriteMaterial({
                    map: labelTexture,
                    transparent: true,
                    depthWrite: false
                })
            );

            label.scale.set(6, 1.5, 1);
            label.position.set(0, radius + 1.3, 0);
            mesh.add(label);

            planets.push({
                name,
                pivot,
                mesh,
                speed,
                angle: index * 0.85
            });
        });

        const starPositions = [];

        for (let i = 0; i < 3500; i++) {
            starPositions.push(
                (Math.random() - 0.5) * 700,
                (Math.random() - 0.5) * 500,
                (Math.random() - 0.5) * 700
            );
        }

        const starGeometry = new THREE.BufferGeometry();

        starGeometry.setAttribute(
            "position",
            new THREE.Float32BufferAttribute(starPositions, 3)
        );

        const starMaterial = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.45,
            transparent: true,
            opacity: 0.85,
            sizeAttenuation: true
        });

        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);

        let paused = false;
        const clock = new THREE.Clock();

        document.getElementById("pauseBtn").onclick = function () {
            paused = !paused;
            this.textContent = paused ? "▶ Play" : "⏸ Pause";
        };

        document.getElementById("resetBtn").onclick = function () {
            camera.position.set(0, 75, 145);
            controls.target.set(0, 0, 0);
            controls.update();
        };

        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.05);

            if (!paused) {
                planets.forEach(planet => {
                    planet.angle += planet.speed * delta * 0.25;
                    planet.pivot.rotation.y = planet.angle;
                    planet.mesh.rotation.y += delta * 0.5;
                });

                sun.rotation.y += delta * 0.1;
                stars.rotation.y += delta * 0.002;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();

            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(
                Math.min(window.devicePixelRatio, 2)
            );
        });
    </script>

</body>
</html>

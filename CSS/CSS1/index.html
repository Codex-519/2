<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furniture Header</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">

        <nav class="left-menu">
            <a href="#">Home</a>
            <a href="#">Collection</a>
            <a href="#">Cart</a>
            <a href="#">Contact</a>
        </nav>

        <div class="center-logo">

            <div class="logo-handle"></div>

            <div class="logo-body">
                <div class="logo-inside"></div>
            </div>

        </div>


        <nav class="right-menu">

            <a href="#">Shops</a>
            <a href="#">Account</a>

            <button class="search-btn">
                <span class="search-circle"></span>
                <span class="search-handle"></span>
            </button>

            <div class="profile">
                <img src="https://i.pravatar.cc/100?img=47" alt="Profile">
            </div>

        </nav>

    </header>

</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Solar System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>SOLAR SYSTEM</h1>
        <p>Explore the Universe</p>
    </header>

    <main class="space">

        <div class="stars"></div>

        <div class="solar-system">

            <div class="sun">
                <span>Sun</span>
            </div>

            <div class="orbit orbit1">
                <div class="planet mercury">
                    <span>Mercury</span>
                </div>
            </div>

            <div class="orbit orbit2">
                <div class="planet venus">
                    <span>Venus</span>
                </div>
            </div>

            <div class="orbit orbit3">
                <div class="planet earth">
                    <span>Earth</span>
                    <div class="moon-orbit">
                        <div class="moon"></div>
                    </div>
                </div>
            </div>

            <div class="orbit orbit4">
                <div class="planet mars">
                    <span>Mars</span>
                </div>
            </div>

            <div class="orbit orbit5">
                <div class="planet jupiter">
                    <span>Jupiter</span>
                </div>
            </div>

            <div class="orbit orbit6">
                <div class="planet saturn">
                    <i class="ring"></i>
                    <span>Saturn</span>
                </div>
            </div>

            <div class="orbit orbit7">
                <div class="planet uranus">
                    <span>Uranus</span>
                </div>
            </div>

            <div class="orbit orbit8">
                <div class="planet neptune">
                    <span>Neptune</span>
                </div>
            </div>

        </div>

        <div class="footer">✦ OUR SOLAR SYSTEM ✦</div>

    </main>

</body>
</html>

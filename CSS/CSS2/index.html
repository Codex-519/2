<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liberetty</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <nav class="navbar">

            <div class="logo">
                Liberetty<span>✦</span>
            </div>

            <div class="nav-links">
                <a href="#">PRODUCTS⌄</a>
                <a href="#">3D MODELS⌄</a>
                <a href="#">GALLERY</a>
                <a href="#">ABOUT</a>
                <a href="#">CONTACT</a>
            </div>

            <div class="right-nav">
                <span class="search">⌕</span>
                <span>CART</span>
                <div class="cart-number">1</div>
            </div>

        </nav>

        <section class="hero">

            <div class="black-square"></div>

            <div class="orange-small"></div>

            <div class="purple-square"></div>

            <div class="orange-big"></div>

            <div class="left-line">
                <span></span>
            </div>

            <div class="new-models">
                NEW MODELS
            </div>

            <h1>
                We <span class="person">
                    <img src="https://randomuser.me/api/portraits/women/44.jpg">
                </span> produce
                <br>
                high-quality furniture
                <br>
                for lifestyle
            </h1>

            <div class="product-day">
                <div class="circle-r">R</div>
                <div class="product-text">
                    PRODUCT<br>
                    OF THE DAY
                </div>
            </div>
            <div class="right-decoration"></div>

            <div class="bottom-line"></div>

            <div class="watch-story">
                <div class="arrow">→</div>
                <span>WATCH OUR STORY</span>
            </div>

        </section>

    </div>

</body>
</html>

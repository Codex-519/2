<!DOCTYPE html>
<html>
<head>
    <style>
        .container {
            width: 700px;
            height: 500px;
            border: 2px solid black;
        }

        .container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .container:hover img {
            display: block;
        }

        .container:focus{
            outline: 3px solid blue;
            background-color: red;
            color: white;
            border:none;
        }

        .cont {
            width: 100px;
            height: 20px;
            border: 2px solid black;
        }

        .cont:hover img {
            display: block;
        }

        .cont:focus{
            outline: 3px solid blue;
            background-color: red;
            color: white;
            border:none;
        }

        .cont:hover img {
            display: block;
        }
    </style>
</head>

<body>

    <div class="container">
        <img src="image.jpg" alt="My Image">
    </div>

    <div class="cont" >

    </div>

</body>
</html>
